version: '3.8'

services:
  ecommerce-api:
    build: .
    container_name: ecommerce-api
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      - ENABLE_BUGS=true
      - ERROR_RATE_PERCENT=20
      - SLOW_QUERY_DELAY=2
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --timeout 120 "src.app.main:create_app()"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  orchestrator:
    build: .
    container_name: war-room-orchestrator
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - OLLAMA_URL=http://ollama:11434
      - LOG_LEVEL=INFO
    command: python -m src.orchestrator
    depends_on:
      - prometheus
      - ollama
      - ecommerce-api
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  ollama_data:
